<script>
const SB_URL="https://ldxxflhwpyzldisydhmd.supabase.co", SB_KEY="sb_publishable_zYVUWmP8r6s21WegS23RxQ_G-MOf1TH";
const catsG=()=>cfg.catG.map(x=>x.n),fijasC=()=>cfg.catG.filter(x=>x.f).map(x=>x.n),rd10=v=>Math.round(v/10)*10;
const $=id=>document.getElementById(id);

const today=()=>fmt(new Date()), dow=s=>parseD(s).getDay(), diff=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);

function slotMin(t){const m=String(t||"").trim().toUpperCase().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/);if(!m)return null;let h=Number(m[1])%12;if(m[3]==="PM")h+=12;return h*60+Number(m[2])}
function passed(f,t){const n=today();if(f<n)return true;if(f>n)return false;const m=slotMin(t);if(m===null)return false;const d=new Date();return m<=d.getHours()*60+d.getMinutes()}

const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let movs=[],turnos=[],gb=[],CB={},B={},RES=[],_fin={},charts={},tab="res";
let cfg={piso:8000,wa:false,cartera0:0,cartDesde:"",pctF:40,pctA:10,pctD:0,pctM:10,fondoMeses:3,fijosPorMes:{},metas:[],deudas:[],
 catG:[{n:"Vivienda",f:1},{n:"Servicios",f:1},{n:"Comida",p:"vital"},{n:"Transporte",p:"vital"},{n:"Salud",p:"vital"},{n:"Hogar"},{n:"Ocio"},{n:"Educación"},{n:"Otros"}],
 catI:["Extra","Venta","Regalo","Otros"]};

$("go").onclick=async()=>{$("lm").textContent="";const{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});

/* ---------- Datos ---------- */
async function all(t,q){let f=0,o=[];for(;;){let r=sb.from(t).select("*");if(q)r=q(r);const{data,error}=await r.order("id").range(f,f+999);if(error)throw error;o=o.concat(data||[]);if(!data||data.length<1000)break;f+=1000}return o}
async function load(){
 $("err").innerHTML="";_fin={};live("save","Actualizando…");
 try{
  movs=await all("family_movs");
  const c=await sb.from("family_config").select("valores").eq("id",1).maybeSingle();
  if(c.data&&c.data.valores)cfg={...cfg,...c.data.valores};
  movs=movs.filter(x=>String(x.fecha).slice(0,10)>=D0());
  // ajustes de la barbería (para repartir igual que ella)
  let cb={};try{const a=await sb.from("ajustes").select("valor").eq("clave","config").limit(1);if(a.data&&a.data.length)cb=a.data[0].valor||{};else{const l=localStorage.getItem("monos_config");if(l)cb=JSON.parse(l)}}catch(e){}
  CB=cb;
  B={start:ISO.test(cb.start_date)?cb.start_date:"2026-10-08",budget:num(cb.barber_budget)>0?num(cb.barber_budget):12000,
   pb:num(cb.barber_pct)>0&&num(cb.barber_pct)<=100?num(cb.barber_pct):50,ps:cb.save_pct!==undefined&&cb.save_pct!==""?num(cb.save_pct):10,
   rd:num(cb.round_step)>=1?num(cb.round_step):10,goal:cb.save_goal!==undefined&&cb.save_goal!==""?num(cb.save_goal):(num(cb.ahorro_meta)>0?num(cb.ahorro_meta):8800)};
  turnos=await all("turnos",q=>q.gte("fecha",B.start).lte("fecha","2999-12-31"));
  const g=await all("gastos");
  gb=g.filter(x=>String(x.fecha)>=B.start&&!/^(aporte|devolucion) personal/.test(String(x.descripcion||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")));
  build();lastOk=Date.now();live("idle");
 }catch(e){live("bad","Sin conexión");$("err").innerHTML='<div class="card bad">No se pudieron leer los datos: '+esc(e.message||e)+'</div>'}
}

/* ---------- Barbería: SOLO tu ganancia neta (misma regla que tu panel de la barbería) ---------- */
function build(){
 const map=new Map();
 turnos.forEach(r=>{
  if(!r.fecha||!ISO.test(r.fecha)||r.fecha<B.start)return;
  if(r.estado&&r.estado!=="ocupado")return; if(r.cancelado===true)return;
  const ph=digits(r.telefono), cobrado=r.precio_cobrado!==null&&r.precio_cobrado!==undefined;
  const fin=cobrado||r.no_show===true||num(r.total)>0||!!r.servicios; if(!ph&&!fin)return;
  const k=r.reserva_id?"r:"+r.reserva_id:"i:"+r.id;
  if(!map.has(k))map.set(k,{fecha:r.fecha,turno:r.turno,ch:0,tip:0,tot:0,exp:0,cob:false,ns:false});
  const x=map.get(k);x.ch+=num(r.precio_cobrado);x.tip+=num(r.propina);x.tot=Math.max(x.tot,num(r.total));x.exp+=num(r.precio_esperado);
  if(cobrado)x.cob=true;if(r.no_show===true)x.ns=true;
 });
 RES=[...map.values()];
 RES.forEach(r=>{r.st=r.ns?"noshow":r.cob?"cobrada":passed(r.fecha,r.turno)?"pendiente":"futura"});
}
const rd=v=>B.rd>1?Math.round(v/B.rd)*B.rd:v;
function splitDay(ing,acc){
 const capS=B.goal>0?B.goal:Infinity;
 const reserve=Math.max(0,Math.min(rd(ing*B.pb/100),ing,B.budget-acc.reserve)), resto=ing-reserve;
 const ahorro=Math.max(0,Math.min(rd(resto*B.ps/100),resto,capS-acc.ahorro));
 return{ing,reserve,ahorro,libre:ing-reserve-ahorro};
}
function netMonth(m){
 if(_fin[m])return _fin[m];
 const rs=RES.filter(r=>r.st==="cobrada"&&r.fecha.slice(0,7)===m), per={};
 rs.forEach(r=>per[r.fecha]=(per[r.fecha]||0)+r.ch+r.tip);
 const acc={reserve:0,ahorro:0},days={};
 Object.keys(per).sort().forEach(d=>{const x=splitDay(per[d],acc);acc.reserve+=x.reserve;acc.ahorro+=x.ahorro;days[d]=x.libre});
 const ing=sum(Object.values(per)), gReg=sum(gb.filter(x=>String(x.fecha).slice(0,7)===m).map(x=>num(x.monto)));
 const deficit=Math.max(0,gReg-acc.reserve), libre=Math.max(0,ing-acc.reserve-acc.ahorro-deficit);
 return _fin[m]={libre,days};
}
/* Predicción del mes en ganancia neta (misma idea que el "Plan" de la barbería) */
function proj(m){
 const t=today(),C=RES.filter(r=>r.st==="cobrada"),by={};
 C.forEach(r=>by[r.fecha]=(by[r.fecha]||0)+r.ch+r.tip);
 const wd={};for(let d=1;d<=6;d++)wd[d]={s:0,w:0};let aS=0,aN=0;
 Object.keys(by).forEach(f=>{if(f>=t)return;const d=dow(f);if(!d)return;const w=Math.pow(.85,Math.floor(diff(f,t)/7));wd[d].s+=by[f]*w;wd[d].w+=w;aS+=by[f];aN++});
 const avg=aN?aS/aN:0,wa=d=>wd[d]&&wd[d].w?wd[d].s/wd[d].w:avg;
 const sc=sum(C.map(r=>r.ch)),tick=C.length?sc/C.length:0,tr=sc>0?sum(C.map(r=>r.tip))/sc:0;
 const bk={},cn={};
 RES.forEach(r=>{if(r.fecha.slice(0,7)!==m)return;if(!(r.st==="futura"||(r.st==="pendiente"&&r.fecha===t)))return;
  const a=r.tot||r.exp||0;bk[r.fecha]=(bk[r.fecha]||0)+(a>0?a:tick)*(1+tr);cn[r.fecha]=(cn[r.fecha]||0)+1});
 const est=(f,base)=>{const w=dow(f),b=base+(bk[f]||0);if(w===0)return b;const gap=Math.max(0,wa(w)-b),ah=diff(t,f);return b+gap*(ah<=0?.1:Math.min(1,.15+.85*(ah-1)/6))};
 const dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(),today_=by[t]||0,remain=Math.max(0,est(t,today_)-today_);
 const aA={reserve:0,ahorro:0},aP={reserve:0,ahorro:0};let cA=0,cP=0,ingP=0,bookedF=0,nF=0;
 const labels=[],act=[],pro=[];
 for(let i=1;i<=dim;i++){
  const f=m+"-"+String(i).padStart(2,"0");labels.push(String(i));
  const real=by[f]||0;
  if(f<=t){const x=splitDay(real,aA);aA.reserve+=x.reserve;aA.ahorro+=x.ahorro;cA+=x.libre;act.push(Math.round(cA))}else act.push(null);
  const g=f<t?real:f===t?real+remain:est(f,0);
  const y=splitDay(g,aP);aP.reserve+=y.reserve;aP.ahorro+=y.ahorro;cP+=y.libre;ingP+=g;
  pro.push(f<t?null:Math.round(cP));
  if(f>t){bookedF+=bk[f]||0;nF+=cn[f]||0}
 }
 const gReg=sum(gb.filter(x=>String(x.fecha).slice(0,7)===m).map(x=>num(x.monto)));
 const end=Math.max(0,ingP-aP.reserve-aP.ahorro-Math.max(0,gReg-aP.reserve));
 return{labels,act,pro,end,bookedF,nF};
}

/* ---------- Cálculos familiares ---------- */
function alloc(day){
 const m=day.slice(0,7),nm=m>=B.start.slice(0,7)?netMonth(m):{days:{}},dd={...nm.days};
 movs.filter(x=>x.tipo==="ingreso"&&String(x.fecha).slice(0,7)===m).forEach(x=>{const d=String(x.fecha).slice(0,10);dd[d]=(dd[d]||0)+num(x.monto)});
 const fj=fijosOf(m).filter(x=>num(x.a)>0),tot=sum(fj.map(x=>num(x.a))),hasD=cfg.deudas.length>0;
 let acc=0,o={net:0,fj:[],ah:0,me:0,de:0,libre:0};
 Object.keys(dd).sort().forEach(d=>{if(d>day)return;const net=dd[d],ft=Math.max(0,rd10(Math.min(net*cfg.pctF/100,net,tot-acc)));acc+=ft;
  if(d!==day)return;let left=ft;
  const items=fj.map((x,i)=>{const v=i===fj.length-1?Math.max(0,left):Math.min(left,rd10(ft*num(x.a)/tot));left-=v;return{n:x.n,v}});
  const ah=rd10(net*cfg.pctA/100),me=rd10(net*cfg.pctM/100),de=hasD?rd10(net*cfg.pctD/100):0;
  o={net,fj:items,ah,me,de,libre:Math.max(0,net-ft-ah-me-de)}});
 return o}
function hoyHtml(){const a=alloc(today()),r=(t,s,v,c)=>`<div class="row"><div><b>${t}</b><div class="sub">${s}</div></div><b class="${c}">${money(v)}</b></div>`;
 if(!a.net)return`<div class="card"><h2>Reparto de hoy</h2><div class="sub">Todavía no hay ganancia hoy. Cuando cobres clientes, aquí verás cuánto separar.</div></div>`;
 return`<div class="card"><h2>Reparto de hoy</h2><div class="sub">Ganancia neta de hoy: <b>${money(a.net)}</b>. Al terminar el día separa estos billetes:</div><div style="margin-top:6px">`+
  a.fj.map(x=>r(esc(x.n),"gasto fijo",x.v,"bad")).join("")+r("Ahorro",cfg.pctA+"% de hoy",a.ah,"save")+r("Metas",cfg.pctM+"% de hoy",a.me,"save")+
  (cfg.deudas.length?r("Deudas",cfg.pctD+"% de hoy",a.de,"warn"):"")+r("Para ti hoy","lo que queda libre",a.libre,"ok")+'</div></div>'}
const fijosOf=m=>{const ks=Object.keys(cfg.fijosPorMes).filter(k=>k<=m).sort();return ks.length?cfg.fijosPorMes[ks[ks.length-1]]:[]};
const ofTipo=(l,t)=>sum(l.filter(x=>x.tipo===t).map(x=>num(x.monto)));
function calc(mp){
 const m=mp||$("mes").value||today().slice(0,7),now=today(),[y,mo]=m.split("-").map(Number),dim=new Date(y,mo,0).getDate();
 const day=now.slice(0,7)===m?+now.slice(8):(m<now.slice(0,7)?dim:0);
 const mm=movs.filter(x=>String(x.fecha).slice(0,7)===m),gs=mm.filter(x=>x.tipo==="gasto");
 const nm=netFrom(m);
 const ingMan=ofTipo(mm,"ingreso"),ingreso=nm.libre+ingMan,gasto=ofTipo(mm,"gasto");
 const fijos=sum(fijosOf(m).map(x=>num(x.a))),fijoPag=sum(gs.filter(x=>fijasC().includes(x.categoria)).map(x=>num(x.monto)));
 const fijoPend=Math.max(0,fijos-fijoPag);
 const aA=ofTipo(mm,"ahorro"),aD=ofTipo(mm,"deuda"),aM=ofTipo(mm,"meta"),hasD=cfg.deudas.length>0;
 const mA=rd10(ingreso*cfg.pctA/100),mD=hasD?rd10(ingreso*cfg.pctD/100):0,mM=rd10(ingreso*cfg.pctM/100);
 const pA=Math.max(0,mA-aA),pD=Math.max(0,mD-aD),pM=Math.max(0,mM-aM);
 const libre=ingreso-gasto-fijoPend-pA-pD-pM,bal=ingreso-gasto-aA-aD-aM;
 const byCat={};gs.forEach(g=>byCat[g.categoria]=(byCat[g.categoria]||0)+num(g.monto));
 const dI={},dG={};Object.keys(nm.days).forEach(k=>dI[k]=nm.days[k]);
 mm.filter(x=>x.tipo==="ingreso").forEach(x=>dI[x.fecha]=(dI[x.fecha]||0)+num(x.monto));
 gs.forEach(g=>dG[g.fecha]=(dG[g.fecha]||0)+num(g.monto));
 const ms={};movs.filter(x=>x.tipo==="gasto").forEach(x=>{const k=String(x.fecha).slice(0,7);ms[k]=(ms[k]||0)+num(x.monto)});
 const ks=Object.keys(ms),prom=Math.max(ks.length?sum(ks.map(k=>ms[k]))/ks.length:0,fijos);
 return{m,dim,day,mm,netB:nm.libre,ingMan,ingreso,gasto,fijos,fijoPend,aA,aD,aM,mA,mD,mM,pA,pD,pM,libre,bal,byCat,dI,dG,prom,

  for(let i=1;i<o.b.length;i++){const d=diff(o.b[i-1].f,o.b[i].f);if(d>0)gp.push(d)}
  const cy=gp.length?Math.round(sum(gp.slice(-3))/Math.min(3,gp.length)):0;return{n:o.n,l:l.m,av,pc:av?(l.m/av-1)*100:0,cy,left:cy?cy-diff(l.f,today()):null}})}
function comprasHtml(){const L=compras();if(!L.length)return"";return'<div class="card"><h2>Tus compras repetidas</h2>'+L.map(o=>'<div class="row"><div><b>'+esc(o.n)+'</b><div class="sub">Última '+money(o.l)+' · antes '+money(o.av)+(Math.abs(o.pc)>=10?(o.pc>0?" · 🔺 más cara "+Math.round(o.pc)+"%":" · 🟢 más barata "+Math.round(-o.pc)+"%"):"")+(o.cy?" · la repites cada ~"+o.cy+" días"+(o.left!==null?(o.left<=0?" · ya te toca":" · en ~"+o.left+" días"):""):"")+'</div></div></div>').join("")+'</div>'}

function pAju(c){
 const fj=fijosOf(c.m);
 $("p-aju").innerHTML=`<div class="card"><h2>Gastos fijos de ${esc(c.m)}</h2><div class="sub">Renta, luz, agua, internet… Cada mes puedes cambiarlos: lo que edites aquí vale desde este mes en adelante.</div><div id="fj" style="margin-top:8px">
 ${fj.map(x=>`<div class="two"><input class="fn" value="${esc(x.n)}" placeholder="Nombre"><input class="fa" type="number" inputmode="decimal" value="${num(x.a)}"><button class="chip" data-fx>×</button></div>`).join("")}</div>
 <button class="chip" data-fadd style="width:100%;margin-bottom:8px">+ Añadir gasto fijo</button><div class="sub">Total: <b>${money(c.fijos)}</b></div></div>
 <div class="card"><h2>¿Cuánto separas de tu ganancia?</h2><div class="sub">Porcentajes de tu ganancia neta de cada día. Todo se redondea a múltiplos de 10.</div>
 <div class="f"><label>% para ahorro</label><input id="pa" type="number" value="${cfg.pctA}"></div>
 <div class="f"><label>% para metas</label><input id="pm" type="number" value="${cfg.pctM}"></div>
 <div class="f"><label>% para pagar deudas</label><input id="pd" type="number" value="${cfg.pctD}"></div>
 <div class="f"><label>Fondo de emergencia: meses de gastos</label><input id="pf" type="number" value="${cfg.fondoMeses}"></div></div>
 <div class="card"><h2>Cartera y avisos</h2>
 <div class="f"><label>Piso: dinero que siempre debe quedar en la cartera</label><input id="pi" type="number" value="${num(cfg.piso)}"></div>
 <div class="f"><label>Contar la cartera desde el día</label><input id="cd" type="date" value="${cfg.cartDesde||""}"></div>
 <div class="f"><label>Dinero que había en la cartera ese día</label><input id="c0" type="number" value="${num(cfg.cartera0)}"></div>
 <div class="f"><label>Enviar avisos importantes a mi WhatsApp (usa el bot de la barbería)</label><select id="wa"><option value="0">No</option><option value="1"${cfg.wa?" selected":""}>Sí</option></select></div></div>
 <div class="card"><h2>Categorías de gastos</h2><div class="sub">Para cada una: prioridad y monto por mes. «Fijo» = gasto fijo (su monto sale de la lista de gastos fijos de arriba).</div><div id="cg" style="margin-top:8px">${cfg.catG.map(x=>crow(x.n,x.f,1,x.p,x.b)).join("")}</div>
 <button class="chip" data-cadd="g" style="width:100%">+ Añadir categoría</button></div>
 <div class="card"><h2>Categorías de ingresos</h2><div class="sub">Para los ingresos que anotes aparte de la barbería.</div><div id="ci" style="margin-top:8px">${cfg.catI.map(x=>crow(x,0,0)).join("")}</div>
 <button class="chip" data-cadd="i" style="width:100%">+ Añadir categoría</button></div>
 <button class="btn" data-save="1">Guardar ajustes</button><p id="am" class="bad"></p>`;
}
const HELP={
"Tu ganancia neta (barbería)":"Lo que te queda a ti de la barbería este mes, después de que tu panel de la barbería separa sus gastos y su ahorro. Se trae solo, no lo escribes.",
"Gastos":"Todo lo que han gastado este mes según lo que anotaron en la pantalla Gastos.",
"Apartado (ahorro, metas, deudas)":"Dinero que ya separaron este mes para ahorro, metas o pagar deudas.",
"Queda en la mano":"Ganancia más ingresos extra, menos gastos y menos lo que ya apartaron.",
"Reparto de hoy":"Cómo repartir la ganancia neta de hoy: cuánto va a cada gasto fijo, ahorro, metas y deudas. Lo que sobra es tuyo. Cámbialo en Ajustes con los porcentajes.",
"¿A dónde se va el dinero?":"Gráfica de círculo: cada color es una categoría de gastos y su tamaño es cuánto se gastó en ella.",

"Reparto del mes":"Del dinero del mes, qué parte se fue en gastos, ahorro, metas, deudas y cuánto queda.",
"Añadir movimiento":"Aquí anotas gastos, ingresos extra, ahorro y aportes a metas o deudas. Los gastos fijos págalos aquí con una categoría marcada «fijo».",
"Movimientos del mes":"Lista de todo lo que se anotó en el mes elegido. Puedes borrar lo que se anotó mal.",
"Metas":"Cosas que quieren comprar o lograr. El tiempo se calcula dividiendo lo que falta entre el aporte mensual que le asignaste.",
"Nueva meta":"Pon el nombre, cuánto cuesta y cuánto le aportarás cada mes. Con eso la web calcula en qué mes la completan.",
"Deudas":"Lo que deben. La web calcula cuándo terminan según la cuota mensual. El % de deudas solo se aparta si hay alguna anotada.",
"Nueva deuda":"Pon cuánto debes en total y cuánto pagas por mes.",
"¿Cuánto vas a ganar este mes?":"Línea verde: lo ganado hasta hoy. Línea azul: lo que se estima que ganarás, usando tus citas ya reservadas y tu ritmo normal. Todo es ganancia neta tuya.",
"Dinero realmente libre":"Lo que puedes gastar sin dañar nada: ganancia menos gastos hechos, fijos que faltan y lo que falta por apartar.",
"Fondo de emergencia":"Ahorro para imprevistos. La meta son varios meses de gastos; la barra muestra cuánto llevan.",
"¿Puedo comprar algo?":"Escribe el precio y dime si es necesario: te digo si conviene comprarlo ahora, esperar o dejarlo.",
"Cartera":"Todo el dinero que tienen disponible para gastar. Se calcula con lo que ganas, menos lo que gastan y lo que apartan.",
"Avisos":"Alertas: cartera bajo el piso, categoría que se pasó del plan o que va muy rápido, y dinero que no alcanza esta semana.",
"Plan de esta semana":"Cuánto gastar esta semana en cada categoría: lo que falta del mes dividido entre las semanas que quedan. Se cubre en orden: vital, con fecha, ahorro y gustos. ✅ alcanza, 🟡 alcanza en parte, ⛔ no alcanza.",
"Tus compras repetidas":"Productos que anotaste más de una vez con el mismo nombre. Te digo si la última compra salió más cara o barata y cada cuánto la repites.",
"Cartera y avisos":"El piso es el dinero que siempre se deja guardado para poder comprar cuando aparece algo. La fecha y el saldo sirven para empezar a contar la cartera desde cero.",
"Observaciones":"Avisos automáticos sobre cómo va el mes.",
"Gastos fijos de*":"Los gastos que se repiten cada mes. Su total es el presupuesto de «Gastos fijos» en el plan semanal.",
"¿Cuánto separas":"Qué porcentaje de tu ganancia del mes va a ahorro, metas y deudas. Si suman más de 100% no te deja guardar.",
"Categorías de gastos":"Los tipos de gasto que verás al anotar. Puedes crear, renombrar o borrar. «Fijo» significa que cuenta como gasto fijo pagado.",

function enhance(root){root.querySelectorAll("h2,.k").forEach(n=>{if(n.dataset.h)return;const t=n.textContent.trim();
 const k=HELP[t]!==undefined?t:Object.keys(HELP).find(x=>x.endsWith("*")&&t.startsWith(x.slice(0,-1)))||Object.keys(HELP).find(x=>x==="¿Cuánto separas"&&t.startsWith(x));
 if(!k)return;n.dataset.h=1;n.insertAdjacentHTML("beforeend",' <button class="info" data-help>?</button>');n.insertAdjacentHTML("afterend",'<div class="help hidden">'+HELP[k]+'</div>')})}
let lastOk=0,liveKind="idle";
const livetxt=()=>{if(!lastOk)return"Conectando…";const s=Math.round((Date.now()-lastOk)/1000);return"En vivo · "+(s<10?"ahora":s<60?"hace "+s+" s":"hace "+Math.floor(s/60)+" min")};
function live(k,t){liveKind=k;const el=$("live");el.className=k==="idle"?"":k;el.querySelector("span").textContent=k==="idle"?livetxt():t}
async function saving(btn,fn){const old=btn.textContent;btn.disabled=true;btn.classList.add("busy");btn.textContent="Guardando…";live("save","Guardando…");
 let ok=false;try{ok=await fn()}catch(e){alert(e.message||e)}
 btn.classList.remove("busy");btn.textContent=ok?"¡Guardado ✓!":"No se guardó";if(ok)btn.classList.add("done");live(ok?"ok":"bad",ok?"Guardado ✓":"Error al guardar");
 setTimeout(()=>{btn.textContent=old;btn.classList.remove("done");btn.disabled=false;live("idle");if(ok)render()},1200)}
async function refresh(){if(document.hidden||$("app").classList.contains("hidden")||liveKind==="save")return;await load();
 if(["res","pla","ase"].includes(tab)&&!document.activeElement.matches("input,select,textarea"))render()}
setInterval(refresh,60000);setInterval(()=>{if(liveKind==="idle")live("idle")},5000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-lastOk>60000)refresh()});
/* ---------- Eventos ---------- */
document.addEventListener("click",async e=>{
 const t=e.target;let b;
 if(b=t.closest("[data-help]")){b.parentNode.nextElementSibling.classList.toggle("hidden");return}
 if(b=t.closest("[data-cadd]")){const g=b.dataset.cadd==="g";$(g?"cg":"ci").insertAdjacentHTML("beforeend",crow("",0,g));return}
 if(b=t.closest("[data-del]")){if(!confirm("¿Borrar este movimiento?"))return;await sb.from("family_movs").delete().eq("id",b.dataset.del);await load();render();return}
 if(b=t.closest("[data-fx]")){b.parentNode.remove();return}
 if(b=t.closest("[data-fadd]")){$("fj").insertAdjacentHTML("beforeend",'<div class="two"><input class="fn" placeholder="Nombre"><input class="fa" type="number" inputmode="decimal"><button class="chip" data-fx>×</button></div>');return}
 if(b=t.closest("[data-save]")){
  const m=$("mes").value,nf=[...document.querySelectorAll("#fj .two")].map(r=>({n:r.querySelector(".fn").value.trim(),a:num(r.querySelector(".fa").value)})).filter(x=>x.n||x.a),
   cg=[...document.querySelectorAll("#cg .crow")].map(r=>({n:r.querySelector(".cn").value.trim(),f:r.querySelector(".cf").checked?1:0,p:r.querySelector(".cp").value,b:num(r.querySelector(".cb").value)})).filter(x=>x.n),
   ci=[...document.querySelectorAll("#ci .crow")].map(r=>r.querySelector(".cn").value.trim()).filter(Boolean),
   pp={pctA:num($("pa").value),pctM:num($("pm").value),pctD:num($("pd").value)};
  if(pp.pctA+pp.pctM+pp.pctD>100){$("am").textContent="Los porcentajes suman más de 100%: bájalos.";return}
  $("am").textContent="";saving(b,async()=>{cfg.fijosPorMes[m]=nf;Object.assign(cfg,pp,{catG:cg,catI:ci,fondoMeses:num($("pf").value)||3,piso:num($("pi").value),cartera0:num($("c0").value),cartDesde:$("cd").value,wa:$("wa").value==="1"});return await saveCfg()});return}
 if(b=t.closest("[data-add]")){let it,k;
  if(b.dataset.add==="meta"){const n=$("gn").value.trim(),o=num($("go").value);if(!n||!(o>0)){alert("Escribe nombre y precio.");return}k="metas";it={id:"m"+Date.now(),n,obj:o,ap:num($("ga").value),ini:num($("gi").value)}}
  else{const n=$("dn").value.trim(),o=num($("dt").value);if(!n||!(o>0)){alert("Escribe nombre y total.");return}k="deudas";it={id:"d"+Date.now(),n,tot:o,cuota:num($("dc").value)}}
  saving(b,async()=>{cfg[k].push(it);return await saveCfg()});return}
 if(b=t.closest("[data-dg]")){const[k,id]=b.dataset.dg.split(":");if(!confirm("¿Borrar?"))return;cfg[k]=cfg[k].filter(x=>x.id!==id);if(await saveCfg())render();return}
 if(b=t.closest("[data-ap]")){const[k,id]=b.dataset.ap.split(":"),g=cfg[k==="meta"?"metas":"deudas"].find(x=>x.id===id),a=num(prompt("¿Cuánto?"));if(!(a>0))return;
  live("save","Guardando…");const{error}=await sb.from("family_movs").insert({tipo:k,fecha:today(),categoria:id,descripcion:g?g.n:"",monto:a});
  if(error){live("bad","Error al guardar");alert(error.message);return}await load();live("ok","Guardado ✓");setTimeout(()=>live("idle"),1500);render()}
});
</script></body></html>
