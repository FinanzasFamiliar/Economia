<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14213d;--mut:#6b7280;--line:#e5e7eb;--ok:#16a34a;--bad:#dc2626;--save:#2563eb;--warn:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2e;--ink:#eef1f7;--mut:#9aa4b8;--line:#263047}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:78px}
.hidden{display:none!important}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;z-index:5}
.hr{max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:19px;margin:0}main{max-width:760px;margin:auto;padding:16px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
button{cursor:pointer}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;margin-top:4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 11px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.grid .card{margin:0}
.k{color:var(--mut);font-size:13px}.v{font-size:25px;font-weight:700;line-height:1.2}
.ok{color:var(--ok)}.bad{color:var(--bad)}.save{color:var(--save)}.warn{color:var(--warn)}
h2{font-size:16px;margin:0 0 6px}.box{height:230px;position:relative}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.sub{color:var(--mut);font-size:13px}
.f{margin-bottom:10px}.f label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;margin-bottom:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px 2px calc(env(safe-area-inset-bottom) + 4px)}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:11.5px;padding:9px 1px}
nav button.on{color:var(--ink);font-weight:700;border-top:2px solid var(--ink)}
.verdict{border-left:5px solid var(--mut);padding:12px 14px;border-radius:8px;background:var(--bg);margin-top:12px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--save)}
.tip{padding:9px 0;border-bottom:1px solid var(--line)}.tip:last-child{border:0}
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}#login .b{width:100%;max-width:360px}
</style></head><body>

<section id="login"><div class="b">
<h1 style="font-size:28px">Finanzas del Hogar</h1><p class="sub">Entra con el mismo correo y contraseña de la barbería.</p>
<div class="f"><label>Correo</label><input id="em" type="email" autocomplete="username"></div>
<div class="f"><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>
<button class="btn" id="go">Entrar</button><p id="lm" class="bad"></p></div></section>

<section id="app" class="hidden">
<header><div class="hr"><h1>Finanzas del Hogar</h1><div style="display:flex;gap:6px"><input type="month" id="mes" style="width:auto;padding:6px"><button class="chip" id="out">Salir</button></div></div></header>
<main><div id="err"></div>
<div id="p-res"></div><div id="p-mov" class="hidden"></div><div id="p-met" class="hidden"></div><div id="p-pla" class="hidden"></div><div id="p-ase" class="hidden"></div><div id="p-aju" class="hidden"></div></main>
<nav id="nav"><button data-t="res" class="on">Resumen</button><button data-t="mov">Gastos</button><button data-t="met">Metas</button><button data-t="pla">Plan</button><button data-t="ase">Asesor</button><button data-t="aju">Ajustes</button></nav>
</section>

<script>
const SB_URL="https://ldxxflhwpyzldisydhmd.supabase.co", SB_KEY="sb_publishable_zYVUWmP8r6s21WegS23RxQ_G-MOf1TH";
const CATS=["Vivienda","Servicios","Comida","Transporte","Salud","Hogar","Ocio","Educación","Otros"], FIJAS=["Vivienda","Servicios"];
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const num=v=>{const n=Number(String(v??"").replace(",","."));return Number.isFinite(n)?n:0};
const money=v=>(v<0?"-$":"$")+Math.abs(Math.round(v||0)).toLocaleString("en-US");
const sum=a=>a.reduce((s,x)=>s+x,0), digits=s=>String(s??"").replace(/\D/g,"");
const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseD=s=>{const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])};
const today=()=>fmt(new Date()), dow=s=>parseD(s).getDay(), diff=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const ISO=/^\d{4}-\d{2}-\d{2}$/;
function slotMin(t){const m=String(t||"").trim().toUpperCase().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/);if(!m)return null;let h=Number(m[1])%12;if(m[3]==="PM")h+=12;return h*60+Number(m[2])}
function passed(f,t){const n=today();if(f<n)return true;if(f>n)return false;const m=slotMin(t);if(m===null)return false;const d=new Date();return m<=d.getHours()*60+d.getMinutes()}

const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let movs=[],turnos=[],gb=[],CB={},B={},RES=[],_fin={},charts={},tab="res";
let cfg={pctA:10,pctD:0,pctM:10,fondoMeses:3,fijosPorMes:{},metas:[],deudas:[]};
$("mes").value=today().slice(0,7);

/* ---------- Sesión ---------- */
$("go").onclick=async()=>{$("lm").textContent="";const{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
 if(error){$("lm").textContent="Correo o contraseña incorrectos.";return}start()};
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};
(async()=>{const{data}=await sb.auth.getSession();if(data.session)start()})();
async function start(){$("login").classList.add("hidden");$("app").classList.remove("hidden");await load();render()}

/* ---------- Datos ---------- */
async function all(t,q){let f=0,o=[];for(;;){let r=sb.from(t).select("*");if(q)r=q(r);const{data,error}=await r.order("id").range(f,f+999);if(error)throw error;o=o.concat(data||[]);if(!data||data.length<1000)break;f+=1000}return o}
async function load(){
 $("err").innerHTML="";_fin={};
 try{
  movs=await all("family_movs");
  const c=await sb.from("family_config").select("valores").eq("id",1).maybeSingle();
  if(c.data&&c.data.valores)cfg={...cfg,...c.data.valores};
  // ajustes de la barbería (para repartir igual que ella)
  let cb={};try{const a=await sb.from("ajustes").select("valor").eq("clave","config").limit(1);if(a.data&&a.data.length)cb=a.data[0].valor||{};else{const l=localStorage.getItem("monos_config");if(l)cb=JSON.parse(l)}}catch(e){}
  CB=cb;
  B={start:ISO.test(cb.start_date)?cb.start_date:"2026-10-08",budget:num(cb.barber_budget)>0?num(cb.barber_budget):12000,
   pb:num(cb.barber_pct)>0&&num(cb.barber_pct)<=100?num(cb.barber_pct):50,ps:cb.save_pct!==undefined&&cb.save_pct!==""?num(cb.save_pct):10,
   rd:num(cb.round_step)>=1?num(cb.round_step):10,goal:cb.save_goal!==undefined&&cb.save_goal!==""?num(cb.save_goal):(num(cb.ahorro_meta)>0?num(cb.ahorro_meta):8800)};
  turnos=await all("turnos",q=>q.gte("fecha",B.start).lte("fecha","2999-12-31"));
  const g=await all("gastos");
  gb=g.filter(x=>String(x.fecha)>=B.start&&!/^(aporte|devolucion) personal/.test(String(x.descripcion||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")));
  build();
 }catch(e){$("err").innerHTML='<div class="card bad">No se pudieron leer los datos: '+esc(e.message||e)+'</div>'}
}

/* ---------- Barbería: SOLO tu ganancia neta (misma regla que tu panel de la barbería) ---------- */
function build(){
 const map=new Map();
 turnos.forEach(r=>{
  if(!r.fecha||!ISO.test(r.fecha)||r.fecha<B.start)return;
  if(r.estado&&r.estado!=="ocupado")return; if(r.cancelado===true)return;
  const ph=digits(r.telefono), cobrado=r.precio_cobrado!==null&&r.precio_cobrado!==undefined;
  const fin=cobrado||r.no_show===true||num(r.total)>0||!!r.servicios; if(!ph&&!fin)return;
  const k=r.reserva_id?"r:"+r.reserva_id:"i:"+r.id;
  if(!map.has(k))map.set(k,{fecha:r.fecha,turno:r.turno,ch:0,tip:0,tot:0,exp:0,cob:false,ns:false});
  const x=map.get(k);x.ch+=num(r.precio_cobrado);x.tip+=num(r.propina);x.tot=Math.max(x.tot,num(r.total));x.exp+=num(r.precio_esperado);
  if(cobrado)x.cob=true;if(r.no_show===true)x.ns=true;
 });
 RES=[...map.values()];
 RES.forEach(r=>{r.st=r.ns?"noshow":r.cob?"cobrada":passed(r.fecha,r.turno)?"pendiente":"futura"});
}
const rd=v=>B.rd>1?Math.round(v/B.rd)*B.rd:v;
function splitDay(ing,acc){
 const capS=B.goal>0?B.goal:Infinity;
 const reserve=Math.max(0,Math.min(rd(ing*B.pb/100),ing,B.budget-acc.reserve)), resto=ing-reserve;
 const ahorro=Math.max(0,Math.min(rd(resto*B.ps/100),resto,capS-acc.ahorro));
 return{ing,reserve,ahorro,libre:ing-reserve-ahorro};
}
function netMonth(m){
 if(_fin[m])return _fin[m];
 const rs=RES.filter(r=>r.st==="cobrada"&&r.fecha.slice(0,7)===m), per={};
 rs.forEach(r=>per[r.fecha]=(per[r.fecha]||0)+r.ch+r.tip);
 const acc={reserve:0,ahorro:0},days={};
 Object.keys(per).sort().forEach(d=>{const x=splitDay(per[d],acc);acc.reserve+=x.reserve;acc.ahorro+=x.ahorro;days[d]=x.libre});
 const ing=sum(Object.values(per)), gReg=sum(gb.filter(x=>String(x.fecha).slice(0,7)===m).map(x=>num(x.monto)));
 const deficit=Math.max(0,gReg-acc.reserve), libre=Math.max(0,ing-acc.reserve-acc.ahorro-deficit);
 return _fin[m]={libre,days};
}
/* Predicción del mes en ganancia neta (misma idea que el "Plan" de la barbería) */
function proj(m){
 const t=today(),C=RES.filter(r=>r.st==="cobrada"),by={};
 C.forEach(r=>by[r.fecha]=(by[r.fecha]||0)+r.ch+r.tip);
 const wd={};for(let d=1;d<=6;d++)wd[d]={s:0,w:0};let aS=0,aN=0;
 Object.keys(by).forEach(f=>{if(f>=t)return;const d=dow(f);if(!d)return;const w=Math.pow(.85,Math.floor(diff(f,t)/7));wd[d].s+=by[f]*w;wd[d].w+=w;aS+=by[f];aN++});
 const avg=aN?aS/aN:0,wa=d=>wd[d]&&wd[d].w?wd[d].s/wd[d].w:avg;
 const sc=sum(C.map(r=>r.ch)),tick=C.length?sc/C.length:0,tr=sc>0?sum(C.map(r=>r.tip))/sc:0;
 const bk={},cn={};
 RES.forEach(r=>{if(r.fecha.slice(0,7)!==m)return;if(!(r.st==="futura"||(r.st==="pendiente"&&r.fecha===t)))return;
  const a=r.tot||r.exp||0;bk[r.fecha]=(bk[r.fecha]||0)+(a>0?a:tick)*(1+tr);cn[r.fecha]=(cn[r.fecha]||0)+1});
 const est=(f,base)=>{const w=dow(f),b=base+(bk[f]||0);if(w===0)return b;const gap=Math.max(0,wa(w)-b),ah=diff(t,f);return b+gap*(ah<=0?.1:Math.min(1,.15+.85*(ah-1)/6))};
 const dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(),today_=by[t]||0,remain=Math.max(0,est(t,today_)-today_);
 const aA={reserve:0,ahorro:0},aP={reserve:0,ahorro:0};let cA=0,cP=0,ingP=0,bookedF=0,nF=0;
 const labels=[],act=[],pro=[];
 for(let i=1;i<=dim;i++){
  const f=m+"-"+String(i).padStart(2,"0");labels.push(String(i));
  const real=by[f]||0;
  if(f<=t){const x=splitDay(real,aA);aA.reserve+=x.reserve;aA.ahorro+=x.ahorro;cA+=x.libre;act.push(Math.round(cA))}else act.push(null);
  const g=f<t?real:f===t?real+remain:est(f,0);
  const y=splitDay(g,aP);aP.reserve+=y.reserve;aP.ahorro+=y.ahorro;cP+=y.libre;ingP+=g;
  pro.push(f<t?null:Math.round(cP));
  if(f>t){bookedF+=bk[f]||0;nF+=cn[f]||0}
 }
 const gReg=sum(gb.filter(x=>String(x.fecha).slice(0,7)===m).map(x=>num(x.monto)));
 const end=Math.max(0,ingP-aP.reserve-aP.ahorro-Math.max(0,gReg-aP.reserve));
 return{labels,act,pro,end,bookedF,nF};
}

/* ---------- Cálculos familiares ---------- */
const fijosOf=m=>{const ks=Object.keys(cfg.fijosPorMes).filter(k=>k<=m).sort();return ks.length?cfg.fijosPorMes[ks[ks.length-1]]:[]};
const ofTipo=(l,t)=>sum(l.filter(x=>x.tipo===t).map(x=>num(x.monto)));
function calc(){
 const m=$("mes").value||today().slice(0,7),now=today(),[y,mo]=m.split("-").map(Number),dim=new Date(y,mo,0).getDate();
 const day=now.slice(0,7)===m?+now.slice(8):(m<now.slice(0,7)?dim:0);
 const mm=movs.filter(x=>String(x.fecha).slice(0,7)===m),gs=mm.filter(x=>x.tipo==="gasto");
 const nm=m>=B.start.slice(0,7)?netMonth(m):{libre:0,days:{}};
 const ingMan=ofTipo(mm,"ingreso"),ingreso=nm.libre+ingMan,gasto=ofTipo(mm,"gasto");
 const fijos=sum(fijosOf(m).map(x=>num(x.a))),fijoPag=sum(gs.filter(x=>FIJAS.includes(x.categoria)).map(x=>num(x.monto)));
 const fijoPend=Math.max(0,fijos-fijoPag);
 const aA=ofTipo(mm,"ahorro"),aD=ofTipo(mm,"deuda"),aM=ofTipo(mm,"meta"),hasD=cfg.deudas.length>0;
 const mA=ingreso*cfg.pctA/100,mD=hasD?ingreso*cfg.pctD/100:0,mM=ingreso*cfg.pctM/100;
 const pA=Math.max(0,mA-aA),pD=Math.max(0,mD-aD),pM=Math.max(0,mM-aM);
 const libre=ingreso-gasto-fijoPend-pA-pD-pM,bal=ingreso-gasto-aA-aD-aM;
 const byCat={};gs.forEach(g=>byCat[g.categoria]=(byCat[g.categoria]||0)+num(g.monto));
 const dI={},dG={};Object.keys(nm.days).forEach(k=>dI[k]=nm.days[k]);
 mm.filter(x=>x.tipo==="ingreso").forEach(x=>dI[x.fecha]=(dI[x.fecha]||0)+num(x.monto));
 gs.forEach(g=>dG[g.fecha]=(dG[g.fecha]||0)+num(g.monto));
 const ms={};movs.filter(x=>x.tipo==="gasto").forEach(x=>{const k=String(x.fecha).slice(0,7);ms[k]=(ms[k]||0)+num(x.monto)});
 const ks=Object.keys(ms),prom=Math.max(ks.length?sum(ks.map(k=>ms[k]))/ks.length:0,fijos);
 return{m,dim,day,mm,netB:nm.libre,ingMan,ingreso,gasto,fijos,fijoPend,aA,aD,aM,mA,mD,mM,pA,pD,pM,libre,bal,byCat,dI,dG,prom,
  ahorroTot:ofTipo(movs,"ahorro"),ritmo:day?gasto/day*dim:0};
}
const col=["#2563eb","#16a34a","#d97706","#dc2626","#7c3aed","#0891b2","#db2777","#65a30d","#64748b"];
const chart=(id,c)=>{if(charts[id])charts[id].destroy();const e=$(id);if(e)charts[id]=new Chart(e,c)};

/* ---------- Pantallas ---------- */
$("mes").onchange=render;
$("nav").onclick=e=>{const t=e.target.dataset.t;if(!t)return;tab=t;[...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.t===t));
 ["res","mov","met","pla","ase","aju"].forEach(x=>$("p-"+x).classList.toggle("hidden",x!==t));render()};
function render(){
 if($("app").classList.contains("hidden"))return;const c=calc();
 ({res:pRes,mov:pMov,met:pMet,pla:pPla,ase:pAse,aju:pAju})[tab](c);
}
function pRes(c){
 $("p-res").innerHTML=`<div class="grid">
 <div class="card"><div class="k">Tu ganancia neta (barbería)</div><div class="v ok">${money(c.netB)}</div><div class="sub">+ extras ${money(c.ingMan)}</div></div>
 <div class="card"><div class="k">Gastos</div><div class="v bad">${money(c.gasto)}</div><div class="sub">Ritmo del mes ${money(c.ritmo)}</div></div>
 <div class="card"><div class="k">Apartado (ahorro, metas, deudas)</div><div class="v save">${money(c.aA+c.aM+c.aD)}</div></div>
 <div class="card"><div class="k">Queda en la mano</div><div class="v ${c.bal>=0?"ok":"bad"}">${money(c.bal)}</div></div></div>
 <div class="card"><h2>¿A dónde se va el dinero?</h2><div class="box"><canvas id="c1"></canvas></div></div>
 <div class="card"><h2>Ingresos y gastos por día</h2><div class="sub">Cada punto es un día</div><div class="box"><canvas id="c2"></canvas></div></div>
 <div class="card"><h2>Reparto del mes</h2><div class="box"><canvas id="c3"></canvas></div></div>`;
 const k=Object.keys(c.byCat);
 chart("c1",{type:"doughnut",data:{labels:k.length?k:["Sin gastos"],datasets:[{data:k.length?k.map(x=>c.byCat[x]):[1],backgroundColor:k.length?col:["#cbd5e1"],borderWidth:0}]},options:{maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"right",labels:{boxWidth:10}}}}});
 const pt=o=>Object.keys(o).map(d=>({x:+d.slice(8),y:o[d]}));
 chart("c2",{type:"scatter",data:{datasets:[{label:"Ingresos",data:pt(c.dI),backgroundColor:"#16a34a",pointRadius:6},{label:"Gastos",data:pt(c.dG),backgroundColor:"#dc2626",pointRadius:6}]},options:{maintainAspectRatio:false,scales:{x:{min:1,max:c.dim}}}});
 chart("c3",{type:"pie",data:{labels:["Gastos","Ahorro","Metas","Deudas","Queda"],datasets:[{data:[c.gasto,c.aA,c.aM,c.aD,Math.max(0,c.bal)],backgroundColor:["#dc2626","#2563eb","#7c3aed","#d97706","#16a34a"],borderWidth:0}]},options:{maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{boxWidth:10}}}}});
}
const opts=a=>a.map(x=>`<option value="${esc(x.id||x)}">${esc(x.n||x)}</option>`).join("");
function pMov(c){
 $("p-mov").innerHTML=`<div class="card"><h2>Añadir movimiento</h2>
 <div class="f"><label>Tipo</label><select id="mt"><option value="gasto">Gasto</option><option value="ingreso">Ingreso extra</option><option value="ahorro">Ahorro: meter dinero</option><option value="ahorro-">Ahorro: sacar dinero</option><option value="meta">Aporte a una meta</option><option value="deuda">Pago de una deuda</option></select></div>
 <div class="f"><label id="mcl">Categoría</label><select id="mc">${opts(CATS)}</select></div>
 <div class="f"><label>Fecha</label><input id="mf" type="date" value="${today()}"></div>
 <div class="f"><label>Descripción</label><input id="md" placeholder="Ej. Supermercado"></div>
 <div class="f"><label>Monto</label><input id="ma" type="number" inputmode="decimal"></div>
 <button class="btn" id="ms">Guardar</button><p id="mmsg" class="bad"></p></div>
 <div class="card"><h2>Movimientos del mes</h2>${c.mm.length?c.mm.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))).map(x=>`<div class="row"><div><b>${esc(x.descripcion||x.categoria||x.tipo)}</b><div class="sub">${esc(String(x.fecha).slice(8)+"/"+String(x.fecha).slice(5,7))} · ${esc(x.tipo)}${x.tipo==="gasto"?" · "+esc(x.categoria):""}</div></div>
 <div style="text-align:right"><b>${money(x.monto)}</b><br><button class="chip" data-del="${x.id}" style="padding:1px 8px">Borrar</button></div></div>`).join(""):'<p class="sub">Aún no hay movimientos.</p>'}</div>`;
 const sel=()=>{const t=$("mt").value;$("mcl").textContent=t==="gasto"?"Categoría":t==="meta"?"¿Qué meta?":t==="deuda"?"¿Qué deuda?":"—";
  $("mc").parentNode.classList.toggle("hidden",!["gasto","meta","deuda"].includes(t));
  $("mc").innerHTML=t==="meta"?opts(cfg.metas):t==="deuda"?opts(cfg.deudas):opts(CATS)};
 $("mt").onchange=sel;
 $("ms").onclick=async()=>{let t=$("mt").value,a=num($("ma").value);if(!(a>0)){$("mmsg").textContent="Escribe un monto válido.";return}
  if(t==="ahorro-"){t="ahorro";a=-a}
  if((t==="meta"||t==="deuda")&&!$("mc").value){$("mmsg").textContent="Primero crea una "+t+" en la pantalla Metas.";return}
  const{error}=await sb.from("family_movs").insert({tipo:t,fecha:$("mf").value,categoria:["gasto","meta","deuda"].includes(t)?$("mc").value:null,descripcion:$("md").value.trim(),monto:a});
  if(error){$("mmsg").textContent="No se pudo guardar: "+error.message;return}await load();render()};
}
const saveCfg=async()=>{const{error}=await sb.from("family_config").upsert({id:1,valores:cfg});if(error)alert("No se pudo guardar: "+error.message);return!error};
function eta(falta,a){if(falta<=0)return"¡Lograda! 🎉";if(!(a>0))return"Pon un aporte mensual para calcular";const n=Math.ceil(falta/a),d=new Date();d.setMonth(d.getMonth()+n);return"~"+n+" mes(es) · "+d.toLocaleDateString("es",{month:"long",year:"numeric"})}
function pMet(c){
 const mt=cfg.metas.map(g=>{const s=num(g.ini)+sum(movs.filter(x=>x.tipo==="meta"&&x.categoria===g.id).map(x=>num(x.monto))),f=Math.max(0,num(g.obj)-s),p=Math.min(100,s/Math.max(1,num(g.obj))*100);
  return`<div class="row" style="display:block"><b>${esc(g.n)}</b> <span class="sub">· ${money(s)} de ${money(g.obj)}</span><div class="bar"><i style="width:${p}%"></i></div>
  <div class="sub">Aporte mensual ${money(g.ap)} → ${eta(f,num(g.ap))}</div>
  <div style="margin-top:6px"><button class="chip" data-ap="meta:${g.id}">Aportar</button> <button class="chip" data-dg="metas:${g.id}">Borrar</button></div></div>`}).join("")||'<p class="sub">Aún no hay metas.</p>';
 const dd=cfg.deudas.map(g=>{const s=sum(movs.filter(x=>x.tipo==="deuda"&&x.categoria===g.id).map(x=>num(x.monto))),f=Math.max(0,num(g.tot)-s),p=Math.min(100,s/Math.max(1,num(g.tot))*100);
  return`<div class="row" style="display:block"><b>${esc(g.n)}</b> <span class="sub">· debes ${money(f)} de ${money(g.tot)}</span><div class="bar"><i style="width:${p}%;background:var(--warn)"></i></div>
  <div class="sub">Cuota mensual ${money(g.cuota)} → ${eta(f,num(g.cuota))}</div>
  <div style="margin-top:6px"><button class="chip" data-ap="deuda:${g.id}">Pagar</button> <button class="chip" data-dg="deudas:${g.id}">Borrar</button></div></div>`}).join("")||'<p class="sub">Sin deudas. 👏</p>';
 $("p-met").innerHTML=`<div class="card"><h2>Metas</h2><div class="sub">Ej. vacaciones, teléfonos. Se calcula cuánto tardas según el aporte mensual.</div>${mt}</div>
 <div class="card"><h2>Nueva meta</h2><div class="f"><label>Nombre</label><input id="gn"></div><div class="f"><label>Cuánto cuesta</label><input id="go" type="number" inputmode="decimal"></div>
 <div class="f"><label>Aporte mensual que le asignas</label><input id="ga" type="number" inputmode="decimal"></div><div class="f"><label>Ya tengo ahorrado (opcional)</label><input id="gi" type="number" inputmode="decimal"></div>
 <button class="btn" data-add="meta">Añadir meta</button></div>
 <div class="card"><h2>Deudas</h2>${dd}</div>
 <div class="card"><h2>Nueva deuda</h2><div class="f"><label>Nombre</label><input id="dn"></div><div class="f"><label>Total que debes</label><input id="dt" type="number" inputmode="decimal"></div>
 <div class="f"><label>Cuota mensual</label><input id="dc" type="number" inputmode="decimal"></div><button class="btn" data-add="deuda">Añadir deuda</button></div>`;
}
function pPla(c){
 const P=proj(c.m),isNow=c.m===today().slice(0,7);
 $("p-pla").innerHTML=`<div class="card"><h2>¿Cuánto vas a ganar este mes?</h2><div class="sub">Solo tu ganancia neta, sin barbería ni ahorro de la barbería.</div><div class="box" style="margin-top:8px"><canvas id="c4"></canvas></div></div>
 <div class="card"><div class="row"><div><b>Cierre estimado (neto para ti)</b><div class="sub">${isNow?"Con tus citas ya reservadas y tu ritmo normal":"Este mes ya cerró"}</div></div><b class="ok">${money(isNow?P.end:c.netB)}</b></div>
 <div class="row"><div><b>Llevas ganado</b><div class="sub">Neto hasta hoy</div></div><b>${money(c.netB)}</b></div>
 <div class="row"><div><b>Reservado para lo que falta</b><div class="sub">${P.nF} cliente(s) agendados (bruto)</div></div><b>${money(P.bookedF)}</b></div></div>`;
 chart("c4",{type:"line",data:{labels:P.labels,datasets:[{label:"Ganado",data:P.act,borderColor:"#16a34a",backgroundColor:"#16a34a24",fill:true,tension:.3,pointRadius:3},
  {label:"Proyección",data:P.pro,borderColor:"#2563eb",borderDash:[6,5],tension:.3,pointRadius:3}]},options:{maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{callback:v=>money(v)}}}}});
}
function pAse(c){
 const tips=[],add=(i,t)=>tips.push(`<div class="tip">${i} ${t}</div>`),fm=c.prom*cfg.fondoMeses,fp=fm?Math.min(100,c.ahorroTot/fm*100):0;
 if(c.pA>0)add("💰","Te faltan "+money(c.pA)+" para tu ahorro del mes ("+cfg.pctA+"%).");else if(c.ingreso)add("✅","Ahorro del mes cumplido.");
 if(c.pM>0&&cfg.metas.length)add("🎯","Aún puedes aportar "+money(c.pM)+" a tus metas este mes.");
 if(c.pD>0)add("🧾","Te faltan "+money(c.pD)+" para tu pago de deudas del mes.");
 if(c.fijoPend>0)add("🏠","Faltan unos "+money(c.fijoPend)+" de gastos fijos: ese dinero ya está comprometido.");
 const top=Object.entries(c.byCat).sort((a,b)=>b[1]-a[1])[0];if(top)add("📊","Tu mayor gasto es <b>"+esc(top[0])+"</b>: "+money(top[1])+".");
 if(c.ritmo>c.ingreso&&c.ingreso>0)add("⚠️","Al ritmo actual gastarías "+money(c.ritmo)+", más de lo que ganas este mes.");
 if(!c.ingreso)add("ℹ️","Aún no hay ingresos este mes.");
 $("p-ase").innerHTML=`<div class="card"><h2>Dinero realmente libre</h2><div class="v ${c.libre>=0?"ok":"bad"}">${money(c.libre)}</div><div class="sub">Ganancia − gastos − fijos pendientes − ahorro, metas y deudas pendientes</div></div>
 <div class="card"><h2>Fondo de emergencia</h2><div class="sub">Meta: ${cfg.fondoMeses} meses de gastos = ${money(fm)}</div><div class="v save">${money(c.ahorroTot)}</div><div class="bar"><i style="width:${fp}%"></i></div></div>
 <div class="card"><h2>¿Puedo comprar algo?</h2><div class="f"><label>Precio</label><input id="pp" type="number" inputmode="decimal"></div>
 <div class="f"><label>¿Es necesario?</label><select id="pn"><option value="1">Sí</option><option value="0">Es un gusto</option></select></div><button class="btn" id="pb">Pedir consejo</button><div id="pv"></div></div>
 <div class="card"><h2>Observaciones</h2>${tips.join("")||'<p class="sub">Sin observaciones.</p>'}</div>`;
 $("pb").onclick=()=>{const p=num($("pp").value),nd=$("pn").value==="1";if(!(p>0))return;let t,cl,x;const ok=c.ahorroTot>=fm;
  if(p<=c.libre*.5&&(ok||nd)){cl="ok";t="Adelante ✅";x="Cabe cómodo sin tocar ahorro, metas ni fijos."}
  else if(p<=c.libre){cl="warn";t=nd?"Se puede, con cuidado 🟡":"Mejor espera 🟡";x=nd?"Cabe, pero deja poco margen. Compara precios.":"Cabe, pero es un gusto y deja poco margen. Espera o completa antes el fondo de emergencia."}
  else if(nd){cl="warn";t="Necesario, pero no alcanza 🟠";x="Te faltarían "+money(p-Math.max(c.libre,0))+". Espera a nuevos ingresos o paga en partes."}
  else{cl="bad";t="No por ahora ⛔";x="Supera tu dinero libre y no es necesario."}
  $("pv").innerHTML=`<div class="verdict" style="border-color:var(--${cl})"><b>${t}</b><div class="sub">${x}</div></div>`};
}
function pAju(c){
 const fj=fijosOf(c.m);
 $("p-aju").innerHTML=`<div class="card"><h2>Gastos fijos de ${esc(c.m)}</h2><div class="sub">Renta, luz, agua, internet… Cada mes puedes cambiarlos: lo que edites aquí vale desde este mes en adelante. Al pagarlos, anótalos como gasto de categoría Vivienda o Servicios.</div><div id="fj" style="margin-top:8px">
 ${fj.map(x=>`<div class="two"><input class="fn" value="${esc(x.n)}" placeholder="Nombre"><input class="fa" type="number" inputmode="decimal" value="${num(x.a)}"><button class="chip" data-fx>×</button></div>`).join("")}</div>
 <button class="chip" data-fadd style="width:100%;margin-bottom:8px">+ Añadir gasto fijo</button><div class="sub">Total: <b>${money(c.fijos)}</b></div></div>
 <div class="card"><h2>¿Cuánto separas de tu ganancia?</h2><div class="sub">Porcentajes de tu ganancia neta del mes.</div>
 <div class="f"><label>% para ahorro</label><input id="pa" type="number" value="${cfg.pctA}"></div>
 <div class="f"><label>% para metas</label><input id="pm" type="number" value="${cfg.pctM}"></div>
 <div class="f"><label>% para pagar deudas</label><input id="pd" type="number" value="${cfg.pctD}"></div>
 <div class="f"><label>Fondo de emergencia: meses de gastos</label><input id="pf" type="number" value="${cfg.fondoMeses}"></div></div>
 <button class="btn" data-save="1">Guardar ajustes</button><p id="am" class="sub"></p>`;
}

/* ---------- Eventos ---------- */
document.addEventListener("click",async e=>{
 const t=e.target;let b;
 if(b=t.closest("[data-del]")){if(!confirm("¿Borrar este movimiento?"))return;await sb.from("family_movs").delete().eq("id",b.dataset.del);await load();render();return}
 if(b=t.closest("[data-fx]")){b.parentNode.remove();return}
 if(b=t.closest("[data-fadd]")){$("fj").insertAdjacentHTML("beforeend",'<div class="two"><input class="fn" placeholder="Nombre"><input class="fa" type="number" inputmode="decimal"><button class="chip" data-fx>×</button></div>');return}
 if(b=t.closest("[data-save]")){
  const m=$("mes").value;cfg.fijosPorMes[m]=[...document.querySelectorAll("#fj .two")].map(r=>({n:r.querySelector(".fn").value.trim(),a:num(r.querySelector(".fa").value)})).filter(x=>x.n||x.a);
  cfg.pctA=num($("pa").value);cfg.pctM=num($("pm").value);cfg.pctD=num($("pd").value);cfg.fondoMeses=num($("pf").value)||3;
  if(cfg.pctA+cfg.pctM+cfg.pctD>100){$("am").textContent="Los porcentajes suman más de 100%.";return}
  $("am").textContent=(await saveCfg())?"Guardado ✓":"";render();return}
 if(b=t.closest("[data-add]")){
  if(b.dataset.add==="meta"){const n=$("gn").value.trim(),o=num($("go").value);if(!n||!(o>0)){alert("Escribe nombre y precio.");return}
   cfg.metas.push({id:"m"+Date.now(),n,obj:o,ap:num($("ga").value),ini:num($("gi").value)})}
  else{const n=$("dn").value.trim(),o=num($("dt").value);if(!n||!(o>0)){alert("Escribe nombre y total.");return}
   cfg.deudas.push({id:"d"+Date.now(),n,tot:o,cuota:num($("dc").value)})}
  if(await saveCfg())render();return}
 if(b=t.closest("[data-dg]")){const[k,id]=b.dataset.dg.split(":");if(!confirm("¿Borrar?"))return;cfg[k]=cfg[k].filter(x=>x.id!==id);if(await saveCfg())render();return}
 if(b=t.closest("[data-ap]")){const[k,id]=b.dataset.ap.split(":"),g=cfg[k+"s"==="metas"?"metas":"deudas"].find(x=>x.id===id),a=num(prompt("¿Cuánto?"));if(!(a>0))return;
  const{error}=await sb.from("family_movs").insert({tipo:k,fecha:today(),categoria:id,descripcion:g?g.n:"",monto:a});if(error){alert(error.message);return}await load();render()}
});
</script></body></html>
